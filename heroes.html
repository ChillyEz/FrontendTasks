<!DOCTYPE html>
<html>
<head>

    <title>Heroes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="images/icon.png">
    <script src="script.js"  type="module" defer></script>
</head>
<body>
    <div class="page-shell">
<header>
            <div class="site-brand">
                <a href="index.html">
                    <img src="images/icon.png" alt="Logo" class="logo">
                </a>
                <div id="site-name">
                    <h1>Dota 2</h1>
                    <h1> Wikitionary</h1>
                </div>
            </div>
            <nav class="navbar navbar-expand-lg bg-dark navbar-dark bootstrap-navbar ">
            <div class="container">
                

            <button 
                class="navbar-toggler ms-auto" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <ul class="navbar-nav mb-lg-0 w-100 align-items-end">

                    <li class="nav-item">
                        <a class="nav-link px-3 py-2 d-flex align-items-center justify-content-center" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-2 py-2 d-flex align-items-center justify-content-center" href="heroes.html">Heroes</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-2 py-2 d-flex align-items-center justify-content-center" href="items.html">Items</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link px-2 py-2 d-flex align-items-center justify-content-center" href="esports.html">Esports</a>
                    </li>
                </ul>
                <form class="d-flex justify-content-end" id="search-form" role="search">
                    <input
                        class="form-control me-2"
                        id="search-input"
                        type="search"
                        placeholder="Search"
                        aria-label="Search"
                    />
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                </div>
            </div>
        </nav>
    </header>

<div class="overlay"></div>

    <main>
        <div class="hero-filters">
    <label for="hero-search" class="visually-hidden">
        Search heroes
    </label>
    <input
        type="text"
        id="hero-search"
        placeholder="Search heroes...">
    <label for="attribute-filter" class="visually-hidden">
        Filter by attribute
    </label>
    <select id="attribute-filter">
        <option value="All">All Attributes</option>
        <option value="Strength">Strength</option>
        <option value="Agility">Agility</option>
        <option value="Intelligence">Intelligence</option>
        <option value="Universal">Universal</option>
    </select>
    <label for="complexity-filter" class="visually-hidden">
        Filter by complexity
    </label>
    <select id="complexity-filter">
        <option value="All">All Complexity</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
    </select>


    <div class="filter-button-section">
    <h4 class="text-center">Attack Type</h4>

        <div class="btn-group" role="group" aria-label="Attack type">

            <input
                type="checkbox"
                class="btn-check attack-type-check"
                id="attack-melee"
                value="Melee"
                autocomplete="off">

            <label class="btn btn-outline-secondary" for="attack-melee">
                Melee
            </label>


            <input
                type="checkbox"
                class="btn-check attack-type-check"
                id="attack-ranged"
                value="Ranged"
                autocomplete="off">

            <label class="btn btn-outline-secondary" for="attack-ranged">
                Ranged
            </label>

        </div>
    </div>

    <div class="filter-button-section">
    <h4 class="text-center">Roles</h4>

    <div class="roles-buttons">

        <input type="checkbox" class="btn-check role-check"
               id="role-carry" value="Carry" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-carry">
            Carry
        </label>

        <input type="checkbox" class="btn-check role-check"
               id="role-nuker" value="Nuker" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-nuker">
            Nuker
        </label>

        <input type="checkbox" class="btn-check role-check"
               id="role-disabler" value="Disabler" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-disabler">
            Disabler
        </label>

        <input type="checkbox" class="btn-check role-check"
               id="role-support" value="Support" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-support">
            Support
        </label>

        <input type="checkbox" class="btn-check role-check"
               id="role-initiator" value="Initiator" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-initiator">
            Initiator
        </label>

        <input type="checkbox" class="btn-check role-check"
               id="role-durable" value="Durable" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-durable">
            Durable
        </label>

        <input type="checkbox" class="btn-check role-check"
               id="role-escape" value="Escape" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-escape">
            Escape
        </label>

        <input type="checkbox" class="btn-check role-check"
               id="role-pusher" value="Pusher" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-pusher">
            Pusher
        </label>

        <input type="checkbox" class="btn-check role-check"
               id="role-jungler" value="Jungler" autocomplete="off">
        <label class="btn btn-outline-danger" for="role-jungler">
            Jungler
        </label>

    </div>

        <button
            type="button"
            id="clear-roles"
            class="btn btn-sm btn-secondary mt-2">
            Clear Roles
        </button>
    </div>

</div>
        <div id="hero-sections"></div>
    </main>
<footer>
    <p>&copy; 2026 My Website. All rights reserved. Amir Baiseitov</p>
</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
